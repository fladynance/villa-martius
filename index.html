<script>
(function () {
  // Crossfade senza "buco": la foto entrante sfuma SOPRA quella corrente,
  // che resta piena sotto finché non è coperta. Ogni foto dura ~1,25 s,
  // con la dissolvenza morbida (0,55 s, vedi .splash-slide in CSS) inclusa.
  var slides = Array.prototype.slice.call(document.querySelectorAll('.splash-slide'));
  // Solo da mobile: la 1ª e la 5ª foto (data-only="desktop") sono escluse dalla rotazione.
  if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
    slides = slides.filter(function (s) { return s.getAttribute('data-only') !== 'desktop'; });
  }
  var n = slides.length;
  if (n < 2) return;
  var INTERVAL = 1250;
  var cur = 0, under = -1;
  // La prima foto idonea parte subito attiva (da mobile può non essere la 1ª del markup).
  for (var j = 0; j < n; j++) {
    slides[j].classList.toggle('is-active', j === 0);
    slides[j].style.zIndex = (j === 0 ? '2' : '0');
  }
  setInterval(function () {
    var next = (cur + 1) % n;
    // la foto di due passi fa è ormai coperta: la spengo (invisibile)
    if (under >= 0) { slides[under].classList.remove('is-active'); slides[under].style.zIndex = '0'; }
    // la corrente scende sotto e resta piena mentre la nuova entra sopra
    slides[cur].style.zIndex = '1';
    under = cur;
    slides[next].style.zIndex = '2';
    slides[next].classList.add('is-active');
    cur = next;
  }, INTERVAL);
})();
(function(){var k=function(){var b=document.getElementById('nl-badge-frame');if(b)b.remove();};k();try{new MutationObserver(k).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}})();
</script>
